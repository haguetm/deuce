[project]
name = "deuce-pipeline"
version = "0.1.0"
description = "Data pipeline for Deuce: Wikidata, Wikipedia, Commons, pageviews, Sackmann stats"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pillow>=10.4",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deuce-pipeline = "deuce_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deuce_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
